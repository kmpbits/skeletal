name: Publish to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    # The iOS targets (iosX64/iosArm64/iosSimulatorArm64) can only be compiled on macOS.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Derive version from release tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            /^\[.+\]:/ { if (found) exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            echo "No CHANGELOG.md section found for version $VERSION — leaving release notes as-is."
          else
            gh release edit "${GITHUB_REF_NAME}" --notes "$NOTES"
          fi

      - name: Run tests
        run: ./gradlew :skeletal:desktopTest

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >
          ./gradlew :skeletal:publishToMavenCentral
          -PVERSION_NAME=${{ steps.version.outputs.version }}
